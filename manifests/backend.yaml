# Over-provisioned echo backend. Made deliberately fast and generously resourced
# so that it never becomes the bottleneck — we want to measure the WAF, not the app.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  labels:
    app: echo
    perf.coraza.io/role: backend
spec:
  replicas: ${BACKEND_REPLICAS}
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      # Pin backend off the gateway/loadgen nodes if you have labelled node pools:
      # nodeSelector:
      #   perf.coraza.io/pool: backend
      containers:
        - name: echo
          image: registry.k8s.io/gateway-api/conformance/echo-basic:v0.1.0
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "${BACKEND_CPU_REQUEST}"
              memory: ${BACKEND_MEM_REQUEST}
            limits:
              cpu: "${BACKEND_CPU_LIMIT}"
              memory: ${BACKEND_MEM_LIMIT}
---
apiVersion: v1
kind: Service
metadata:
  name: echo
spec:
  selector:
    app: echo
  ports:
    - port: 80
      targetPort: 3000
